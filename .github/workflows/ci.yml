name: CI

# Build every PR targeting main so a broken build is caught before merge.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `npm run build` runs `tsc -b && vite build`, so this fails on type errors too.
      - run: npm run build
